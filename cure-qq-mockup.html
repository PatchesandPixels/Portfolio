<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quote — Adjust Coverages Mockup</title>
  <style>

    body {
      margin: 0;
      min-height: 100vh;
      background: #fcf7f4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-mockup {
      width: 700px;           /* ← resize the whole mockup here */
      border-radius: 24px;    /* ← controls corner rounding */
      overflow: hidden;       /* clips video to rounded corners */
      display: block;
      box-shadow: 0 24px 64px rgba(0,0,0,0.15);
    }

    .phone-mockup video {
      width: 100%;
      height: auto;
      display: block;
    }

  </style>
</head>
<body>

  <div class="phone-mockup">
    <video autoplay loop muted playsinline>
      <source src="assets/cure-qq-with-bg.mp4" type="video/mp4">
    </video>
  </div>

</body>
</html>
